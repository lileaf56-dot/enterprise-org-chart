      const proj = getCurrentProject();
      const isVert = (proj.orientation || 'vertical') === 'vertical';
      const style = override.style || globalStyle;

      let sx, sy, tx, ty;

      if (isVert) {
        sx = s.x + CARD_W / 2;
        sy = s.y + cardH;
        tx = t.x + CARD_W / 2;
        ty = t.y;

        // 正交折線
        if (style === 'orthogonal') {
          // 加入用戶手柄拖動的 offset
          let my = sy + (ty - sy) / 2 + splitOffset;
          // 防止拉出上下卡片範圍
          my = Math.max(sy + 8, Math.min(ty - 8, my));
          return `M ${sx} ${sy} L ${sx} ${my} L ${tx} ${my} L ${tx} ${ty}`;
        }
        if (style === 'straight') {
          return `M ${sx} ${sy} L ${tx} ${ty}`;
        }
        // 圓弧曲線
        const my = sy + (ty - sy) / 2 + splitOffset;
        return `M ${sx} ${sy} C ${sx} ${my}, ${tx} ${my}, ${tx} ${ty}`;
      } else {
        // 橫向樹
        sx = s.x + CARD_W;
        sy = s.y + cardH / 2;
        tx = t.x;
        ty = t.y + cardH / 2;

        if (style === 'orthogonal') {
          let mx = sx + (tx - sx) / 2 + splitOffset;
          mx = Math.max(sx + 8, Math.min(tx - 8, mx));
          return `M ${sx} ${sy} L ${mx} ${sy} L ${mx} ${ty} L ${tx} ${ty}`;
        }
        if (style === 'straight') {
          return `M ${sx} ${sy} L ${tx} ${ty}`;
        }
        const mx = sx + (tx - sx) / 2 + splitOffset;
        return `M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ty}, ${tx} ${ty}`;
      }
    }

    // 全局渲染
    function render() {
      const proj = getCurrentProject();

      // 套用解耦的畫布底色與底紋
      canvasContainer.className = `bg-${proj.canvasBg || 'slate'} pattern-${proj.canvasPattern || 'dots'}`;

      const isVert = (proj.orientation || 'vertical') === 'vertical';
      document.getElementById('btn-layout-vert').classList.toggle('active', isVert);
      document.getElementById('btn-layout-horiz').classList.toggle('active', !isVert);
      document.getElementById('btn-mode-simple').classList.toggle('active', !showResponsibilities);
      document.getElementById('btn-mode-detail').classList.toggle('active', showResponsibilities);

      const linkStyle = proj.linkStyle || 'orthogonal';
      const globalLineWidth = proj.lineWidth || 1.5;
      const styleNameMap = {
        'orthogonal': '📐 直角折線',
        'curve': '〰️ 圓弧曲線',
        'straight': '📏 直線連接'
      };
      const lbl = document.getElementById('link-style-label');
      if (lbl) lbl.textContent = styleNameMap[linkStyle] || '📐 直角折線';

      // 同步外觀面板中各按鈕高亮
      document.querySelectorAll('#appearance-dropdown .mini-choice-btn').forEach(b => b.classList.remove('active'));
      const orthoBtn = document.getElementById('style-btn-' + (linkStyle === 'orthogonal' ? 'ortho' : linkStyle));
      if (orthoBtn) orthoBtn.classList.add('active');
      const wBtn = document.getElementById('width-btn-' + String(globalLineWidth).replace('.', ''));
      if (wBtn) wBtn.classList.add('active');
      const patBtn = document.getElementById('pat-btn-' + (proj.canvasPattern || 'dots'));
      if (patBtn) patBtn.classList.add('active');
      document.querySelectorAll('#appearance-dropdown .canvas-color-tile').forEach(b => {
        b.classList.toggle('active', b.classList.contains('tile-' + (proj.canvasBg || 'slate')));
      });
      document.querySelectorAll('#appearance-dropdown .palette-theme-row').forEach(b => {
        b.classList.toggle('active', b.classList.contains('theme-' + (proj.cardPaletteTheme || 'classic')));
      });

      layoutTree(proj.root, proj.orientation || 'vertical');
      const { nodes, links, matrixLinks } = flatten(proj.root);
      const cardH = getCardH();

      // 1. 繪製連線 (加厚感應區，點擊可選，支援單根自訂)
      let linksHtml = '';
      let handlesHtml = '';
      const renderedTrunkHandles = new Set();

      links.forEach(l => {
        const override = (proj.linkOverrides || {})[l.id] || {};
        const splitOffset = (proj.splitOffsets || {})[l.source.id] || 0;
        const d = computeSmartPath(l.source, l.target, linkStyle, override, splitOffset);
        const isSelected = selectedLinkId === l.id;
        const strokeW = override.width || globalLineWidth;
        const strokeColor = override.color || (isSelected ? '#2563eb' : 'var(--line-solid)');
        const isDashed = override.dashed;

        linksHtml += `
          <g class="link-group" data-link-id="${l.id}">
            <path d="${d}" class="link-hit-area" data-link-id="${l.id}" />
            <path d="${d}" class="link-path ${isSelected ? 'selected-link' : ''}" 
                  id="${l.id}" 
                  data-link-id="${l.id}"
                  style="stroke-width: ${strokeW}px; stroke: ${strokeColor}; ${isDashed ? 'stroke-dasharray: 4,4;' : ''}" />
          </g>
        `;

        // 如果是直角正交折線，在 T 型橫桿中點放置可拖拽手柄
        const curStyle = override.style || linkStyle;
        if (curStyle === 'orthogonal') {
          let hx, hy;
          if (isVert) {
            let my = l.source.y + cardH + (l.target.y - (l.source.y + cardH)) / 2 + splitOffset;
            hy = Math.max(l.source.y + cardH + 8, Math.min(l.target.y - 8, my));
            hx = isSelected ? (l.source.x + CARD_W / 2 + l.target.x + CARD_W / 2) / 2 : (l.source.x + CARD_W / 2);
          } else {
            let mx = l.source.x + CARD_W + (l.target.x - (l.source.x + CARD_W)) / 2 + splitOffset;
            hx = Math.max(l.source.x + CARD_W + 8, Math.min(l.target.x - 8, mx));
            hy = isSelected ? (l.source.y + cardH / 2 + l.target.y + cardH / 2) / 2 : (l.source.y + cardH / 2);
          }

          if (isSelected || !renderedTrunkHandles.has(l.source.id)) {
            renderedTrunkHandles.add(l.source.id);
            handlesHtml += `
              <g class="link-split-handle" data-source-id="${l.source.id}" data-link-id="${l.id}" transform="translate(${hx}, ${hy})" title="按住上下拖動可自由調節分支折線高度">
                <circle r="7.5" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
                <text text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="8.5" font-weight="bold">↕</text>
              </g>
            `;
          }
        }
      });
      linksLayer.innerHTML = linksHtml;

      // 2. 繪製矩陣虛線 (支援點選與自訂樣式，不與實線打架)
      let matrixHtml = '';
      matrixLinks.forEach(l => {
        const override = (proj.linkOverrides || {})[l.id] || {};
        const isSelected = selectedLinkId === l.id;
        const strokeW = override.width || globalLineWidth;
        const curStyle = override.style || (linkStyle === 'curve' ? 'curve' : 'curve');
        const matrixOffset = override.splitOffset !== undefined ? override.splitOffset : 35;

        const sx = l.source.x + CARD_W / 2;
        const sy = l.source.y + cardH / 2;
        const tx = l.target.x + CARD_W / 2;
        const ty = l.target.y + cardH / 2;
        const hx = (sx + tx) / 2 + matrixOffset;
        const hy = (sy + ty) / 2;

        let pathData;
        if (curStyle === 'curve') {
          pathData = `M ${sx} ${sy} Q ${hx} ${hy - 35}, ${tx} ${ty}`;
        } else if (curStyle === 'straight') {
          pathData = `M ${sx} ${sy} L ${tx} ${ty}`;
        } else {
          pathData = `M ${sx} ${sy} L ${hx} ${sy} L ${hx} ${ty} L ${tx} ${ty}`;
        }

        matrixHtml += `
          <g class="link-group" data-link-id="${l.id}">
            <path d="${pathData}" class="link-hit-area" data-link-id="${l.id}" />
            <path d="${pathData}" class="link-matrix ${isSelected ? 'selected-link' : ''}" 
                  id="${l.id}" 
                  data-link-id="${l.id}"
                  style="stroke-width: ${strokeW}px; ${override.color ? `stroke: ${override.color};` : ''}" />
          </g>
        `;

        // 矩陣虛線被選中時，在中段顯示避讓調節手柄
        if (isSelected) {
          handlesHtml += `
            <g class="link-matrix-handle" data-link-id="${l.id}" transform="translate(${hx}, ${curStyle === 'curve' ? hy - 18 : hy})" title="按住左右拖動可自由調整避讓位置，避免重疊">
              <circle r="7.5" fill="#d97706" stroke="#ffffff" stroke-width="2" />
              <text text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="8.5" font-weight="bold">↔</text>
            </g>
          `;
        }
      });
      matrixLinksLayer.innerHTML = matrixHtml;
      handlesLayer.innerHTML = handlesHtml;

      // 3. 繪製自由文字便簽
      let notesHtml = '';
      (proj.notes || []).forEach(note => {
        notesHtml += `
          <foreignObject x="${note.x}" y="${note.y}" width="220" height="80" id="fo-note-${note.id}">
            <div class="free-note-box" data-note-id="${note.id}">
              <button class="note-del-btn" onclick="deleteNote('${note.id}')" title="刪除此文字說明">✕</button>
              <textarea class="note-textarea" 
                        placeholder="在此輸入說明文字..." 
                        oninput="updateNoteText('${note.id}', this.value)">${escapeHtml(note.text || '')}</textarea>
            </div>
          </foreignObject>
        `;
      });
      notesLayer.innerHTML = notesHtml;

      // 4. 節點卡片
      let nodesHtml = '';
      nodes.forEach(n => {
        const isSelected = n.id === selectedNodeId;
        const status = n.status || 'active';
        const colorKey = n.colorTheme || 'blue';
        const intensity = n.colorIntensity || 'normal';
        const duties = normalizeDuties(n.responsibilities);

        let dutiesHtml = '';
        if (showResponsibilities) {
          const list = duties.length > 0 ? duties : [{ text: '未設定核心職責事項', raci: 'R' }];
          dutiesHtml = `
            <div class="card-duties-wrapper">
              ${list.map(d => `
                <div class="card-duty-row">
                  <span class="raci-pill raci-${d.raci}">${d.raci}</span>
                  <span>${escapeHtml(d.text)}</span>
                </div>
              `).join('')}
            </div>
          `;
        }

        let statusTag = '';
        if (status === 'hiring') {
          statusTag = `<span style="font-size: 9.5px; background: #ffedd5; color: #ea580c; padding: 1px 4px; border-radius: 3px; font-weight: 700;">招募中</span>`;
        } else if (status === 'contractor') {
          statusTag = `<span style="font-size: 9.5px; background: #ede9fe; color: #7c3aed; padding: 1px 4px; border-radius: 3px; font-weight: 700;">外聘</span>`;
        }

        const cardClass = `card-theme-${colorKey} intensity-${intensity}`;

        nodesHtml += `
          <foreignObject x="${n.x}" y="${n.y}" width="${CARD_W}" height="${cardH}" id="fo-${n.id}">
            <div class="node-card ${cardClass} status-${status} ${isSelected ? 'selected' : ''}" data-id="${n.id}">
              <div class="card-header-row">
                <span class="title-pill-tag">
                  ${escapeHtml(n.title || '職位待定')}
                </span>
                ${statusTag}
                <div class="card-hover-actions" onclick="event.stopPropagation()">
                  <button class="mini-svg-btn" onclick="addSingleChild('${n.id}')" title="加一層下級">+</button>
                  <button class="mini-svg-btn" onclick="addTwoLevels('${n.id}')" title="一鍵加兩層">+2</button>
                  <button class="mini-svg-btn" onclick="addSibling('${n.id}')" title="加同級同事">═</button>
                  ${n.id !== proj.root.id ? `<button class="mini-svg-btn danger" onclick="removeNode('${n.id}')" title="刪除">✕</button>` : ''}
                </div>
              </div>

              <div class="card-user-row">
                <div class="card-person-name">${escapeHtml(n.name || '姓名待填')}</div>
              </div>

              <div class="card-dept-text">
                <span class="card-dept-dot" style="background-color: var(--brand-blue);"></span>
                <span>${escapeHtml(n.department || '未分配部門')}</span>
              </div>

              ${dutiesHtml}
            </div>
          </foreignObject>
        `;
      });
      nodesLayer.innerHTML = nodesHtml;

      attachInteractionEvents();
      renderProjectTabs();
      updateTransform();
      saveData();
    }

    // 交互事件綁定 (卡片、便簽、手柄)
    function attachInteractionEvents() {
      const proj = getCurrentProject();

      // 卡片拖動
      document.querySelectorAll('.node-card').forEach(card => {
        const id = card.getAttribute('data-id');
        card.addEventListener('mousedown', (e) => {
          if (e.target.closest('.mini-svg-btn')) return;

          activeDragItem = findNodeById(proj.root, id);
          if (!activeDragItem) return;
          dragItemType = 'node';

          dragStartMouseX = e.clientX;
          dragStartMouseY = e.clientY;
          itemInitialX = activeDragItem.x;
          itemInitialY = activeDragItem.y;
          hasMoved = false;

          card.classList.add('dragging');
          e.stopPropagation();
        });
      });

      // 便簽拖動
      document.querySelectorAll('.free-note-box').forEach(noteBox => {
        const noteId = noteBox.getAttribute('data-note-id');
        noteBox.addEventListener('mousedown', (e) => {
          if (e.target.closest('.note-textarea') || e.target.closest('.note-del-btn')) return;

          activeDragItem = (proj.notes || []).find(n => n.id === noteId);
          if (!activeDragItem) return;
          dragItemType = 'note';

          dragStartMouseX = e.clientX;
          dragStartMouseY = e.clientY;
          itemInitialX = activeDragItem.x;
          itemInitialY = activeDragItem.y;
          hasMoved = false;

          e.stopPropagation();
        });
      });

      // 連線群組直接綁定點擊事件 (確保 100% 靈敏點選，不被畫布平移攔截)
      document.querySelectorAll('.link-group').forEach(lg => {
        const linkId = lg.getAttribute('data-link-id');
        lg.addEventListener('click', (e) => {
          e.stopPropagation();
          selectLink(linkId);
        });
        lg.addEventListener('mousedown', (e) => {
          e.stopPropagation();
        });
      });

      // 正交折線分叉橫桿高度手柄
      document.querySelectorAll('.link-split-handle').forEach(handle => {
        const sourceId = handle.getAttribute('data-source-id');
        const linkId = handle.getAttribute('data-link-id');
        handle.addEventListener('mousedown', (e) => {
          activeDragItem = { sourceId, linkId };
          dragItemType = 'handle';

          dragStartMouseX = e.clientX;
          dragStartMouseY = e.clientY;
          itemInitialY = (proj.splitOffsets || {})[sourceId] || 0;
          itemInitialX = (proj.splitOffsets || {})[sourceId] || 0;
          hasMoved = false;

          e.stopPropagation();
        });
      });

      // 矩陣虛線避讓位置手柄
      document.querySelectorAll('.link-matrix-handle').forEach(handle => {
        const linkId = handle.getAttribute('data-link-id');
        handle.addEventListener('mousedown', (e) => {
          activeDragItem = { linkId };
          dragItemType = 'matrix-handle';

          dragStartMouseX = e.clientX;
          dragStartMouseY = e.clientY;
          const override = (proj.linkOverrides || {})[linkId] || {};
          itemInitialX = override.splitOffset !== undefined ? override.splitOffset : 35;
          hasMoved = false;

          e.stopPropagation();
        });
      });
    }

    window.addEventListener('mousemove', (e) => {
      if (!activeDragItem) return;

      const dx = (e.clientX - dragStartMouseX) / zoom;
      const dy = (e.clientY - dragStartMouseY) / zoom;

      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
        hasMoved = true;
      }

      if (dragItemType === 'node') {
        activeDragItem.x = Math.round(itemInitialX + dx);
        activeDragItem.y = Math.round(itemInitialY + dy);
        activeDragItem.isAutoPlaced = false;

        const fo = document.getElementById(`fo-${activeDragItem.id}`);
        if (fo) {
          fo.setAttribute('x', activeDragItem.x);
          fo.setAttribute('y', activeDragItem.y);
        }
        render();
      } else if (dragItemType === 'note') {
        activeDragItem.x = Math.round(itemInitialX + dx);
        activeDragItem.y = Math.round(itemInitialY + dy);

        const fo = document.getElementById(`fo-note-${activeDragItem.id}`);
        if (fo) {
          fo.setAttribute('x', activeDragItem.x);
          fo.setAttribute('y', activeDragItem.y);
        }
      } else if (dragItemType === 'handle') {
        // 調節拐點高度距離
        const proj = getCurrentProject();
        const isVert = (proj.orientation || 'vertical') === 'vertical';
        const delta = isVert ? dy : dx;
        const newOffset = Math.round(itemInitialY + delta);

        if (!proj.splitOffsets) proj.splitOffsets = {};
        proj.splitOffsets[activeDragItem.sourceId] = newOffset;
        render();

        // 同步更新右側抽屜的滑塊數值
        const slider = document.getElementById('link-offset-slider');
        const numLabel = document.getElementById('link-offset-val');
        if (slider) slider.value = newOffset;
        if (numLabel) numLabel.textContent = `${newOffset > 0 ? '+' : ''}${newOffset}px`;
      } else if (dragItemType === 'matrix-handle') {
        // 調節矩陣虛線避讓偏置
        const proj = getCurrentProject();
        if (!proj.linkOverrides) proj.linkOverrides = {};
        if (!proj.linkOverrides[activeDragItem.linkId]) proj.linkOverrides[activeDragItem.linkId] = {};
        const newOffset = Math.round(itemInitialX + dx);
        proj.linkOverrides[activeDragItem.linkId].splitOffset = newOffset;
        render();

        // 同步更新右側抽屜的滑塊數值
        const slider = document.getElementById('matrix-offset-slider');
        const numLabel = document.getElementById('matrix-offset-val');
        if (slider) slider.value = newOffset;
        if (numLabel) numLabel.textContent = `${newOffset}px`;
      }
    });

    window.addEventListener('mouseup', () => {
      if (!activeDragItem) return;

      if (dragItemType === 'node') {
        const card = document.querySelector(`.node-card[data-id="${activeDragItem.id}"]`);
        if (card) card.classList.remove('dragging');
        if (!hasMoved) {
          selectNode(activeDragItem.id);
        } else {
          saveData();
        }
      } else {
        saveData();
      }

      activeDragItem = null;
      dragItemType = null;
    });

    // ========================================================
    // 單根連線點選與獨立屬性抽屜
    // ========================================================
    window.selectLink = function(linkId, e) {
      if (e) e.stopPropagation();
      selectedLinkId = linkId;
      selectedNodeId = null;

      render();
      openLinkDrawer(linkId);
    };

    function openLinkDrawer(linkId) {
      sideDrawer.classList.remove('hidden');

      const proj = getCurrentProject();
      if (!proj.linkOverrides) proj.linkOverrides = {};
      const override = proj.linkOverrides[linkId] || {};
      const isMatrix = linkId.startsWith('matrix-');

      // 提取起點與終點節點名稱
      const cleanId = linkId.replace('matrix-', '').replace('link-', '');
      const parts = cleanId.split('-');
      const sId = parts[0];
      const tId = parts[1];
      const sNode = findNodeById(proj.root, sId);
      const tNode = findNodeById(proj.root, tId);
      const sName = sNode ? (sNode.name || sNode.title) : '主管';
      const tName = tNode ? (tNode.name || tNode.title) : '成員';

      drawerHeaderContent.innerHTML = `
        <div class="drawer-header-left">
          <span style="font-size: 15px;">${isMatrix ? '🔸' : '📐'}</span>
          <div class="drawer-title-group">
            <span class="drawer-title-text">${isMatrix ? '協同虛線設定' : '直屬實線設定'}</span>
            <span class="drawer-subtitle-text">${escapeHtml(sName)} ➔ ${escapeHtml(tName)}</span>
          </div>
        </div>
        <button class="icon-btn" onclick="closeDrawer()" style="width: 20px; height: 20px;">✕</button>
      `;

      const currentStyle = override.style || (isMatrix ? 'curve' : proj.linkStyle || 'orthogonal');
      const currentWidth = override.width || proj.lineWidth || 1.5;
      const currentColor = override.color || '';
      const isDashed = override.dashed !== undefined ? override.dashed : isMatrix;
      const splitOffset = (proj.splitOffsets || {})[sId] || 0;
      const matrixOffset = override.splitOffset !== undefined ? override.splitOffset : 35;

      drawerFormContent.innerHTML = `
        <div class="form-compact-section">
          <!-- 線條形態 (實線/虛線) -->
          <div class="field-row">
            <span class="field-label">型態</span>
            <select class="field-select" onchange="updateSingleLink('${linkId}', 'dashed', this.value === 'true')">
              <option value="false" ${!isDashed ? 'selected' : ''}>—— 實線</option>
              <option value="true" ${isDashed ? 'selected' : ''}>- - - 虛線</option>
            </select>
          </div>

          <!-- 線條形狀 -->
          <div class="field-row">
            <span class="field-label">形狀</span>
            <select class="field-select" onchange="updateSingleLink('${linkId}', 'style', this.value)">
              <option value="orthogonal" ${currentStyle === 'orthogonal' ? 'selected' : ''}>📐 橫平豎直 (正交折線)</option>
              <option value="curve" ${currentStyle === 'curve' ? 'selected' : ''}>〰️ 平滑圓弧 (貝塞爾曲線)</option>
              <option value="straight" ${currentStyle === 'straight' ? 'selected' : ''}>📏 直線連接</option>
            </select>
          </div>

          <!-- 線條粗細 -->
          <div class="field-row">
            <span class="field-label">粗細</span>
            <select class="field-select" onchange="updateSingleLink('${linkId}', 'width', parseFloat(this.value))">
              <option value="1" ${currentWidth === 1 ? 'selected' : ''}>細線 (1.0px)</option>
              <option value="1.5" ${currentWidth === 1.5 ? 'selected' : ''}>標準 (1.5px)</option>
              <option value="2.5" ${currentWidth === 2.5 ? 'selected' : ''}>加粗 (2.5px)</option>
            </select>
          </div>

          <!-- 線條色彩 -->
          <div class="field-row">
            <span class="field-label">色彩</span>
            <select class="field-select" onchange="updateSingleLink('${linkId}', 'color', this.value)">
              <option value="" ${!currentColor ? 'selected' : ''}>預設色彩</option>
              <option value="#2563eb" ${currentColor === '#2563eb' ? 'selected' : ''}>🔵 商務藍</option>
              <option value="#059669" ${currentColor === '#059669' ? 'selected' : ''}>🟢 翡翠綠</option>
              <option value="#d97706" ${currentColor === '#d97706' ? 'selected' : ''}>🟠 琥珀橙</option>
              <option value="#ef4444" ${currentColor === '#ef4444' ? 'selected' : ''}>🔴 朱紅色</option>
              <option value="#64748b" ${currentColor === '#64748b' ? 'selected' : ''}>🔘 冷灰</option>
            </select>
          </div>

          <!-- 位置/距離微調滑塊 (滿足用戶拉遠拉近、調高度的要求) -->
          ${!isMatrix ? `
            <div class="field-row" style="margin-top: 4px;">
              <span class="field-label">高低</span>
              <input type="range" id="link-offset-slider" min="-60" max="60" value="${splitOffset}" 
                     style="flex: 1;"
                     oninput="updateLinkOffset('${sId}', this.value)">
              <span id="link-offset-val" style="width: 42px; text-align: right; font-size: 11px; color: var(--text-muted);">${splitOffset > 0 ? '+' : ''}${splitOffset}px</span>
            </div>
            <div style="font-size: 10px; color: var(--text-muted); line-height: 1.3; padding-left: 54px;">
              可直接在畫布上拖動藍色手柄調節折線高低
            </div>
          ` : `
            <div class="field-row" style="margin-top: 4px;">
              <span class="field-label">偏置</span>
              <input type="range" id="matrix-offset-slider" min="-150" max="150" value="${matrixOffset}" 
                     style="flex: 1;"
                     oninput="updateMatrixOffset('${linkId}', this.value)">
              <span id="matrix-offset-val" style="width: 42px; text-align: right; font-size: 11px; color: var(--text-muted);">${matrixOffset}px</span>
            </div>
            <div style="font-size: 10px; color: var(--text-muted); line-height: 1.3; padding-left: 54px;">
              可直接在畫布上左右拖動橙色手柄避讓其他卡片
            </div>
          `}
        </div>
      `;

      drawerFooterActions.innerHTML = `
        <button class="footer-act-btn" style="grid-column: span 2;" onclick="resetSingleLink('${linkId}')">🔄 還原預設</button>
        <button class="footer-act-btn" style="grid-column: span 2;" onclick="closeDrawer()">完成關閉</button>
      `;
    }

    window.updateLinkOffset = function(sourceId, val) {
      const proj = getCurrentProject();
      if (!proj.splitOffsets) proj.splitOffsets = {};
      proj.splitOffsets[sourceId] = parseInt(val, 10);
      const numLabel = document.getElementById('link-offset-val');
      if (numLabel) numLabel.textContent = `${val > 0 ? '+' : ''}${val}px`;
      render();
    };

    window.updateMatrixOffset = function(linkId, val) {
      const proj = getCurrentProject();
      if (!proj.linkOverrides) proj.linkOverrides = {};
      if (!proj.linkOverrides[linkId]) proj.linkOverrides[linkId] = {};
      proj.linkOverrides[linkId].splitOffset = parseInt(val, 10);
      const numLabel = document.getElementById('matrix-offset-val');
      if (numLabel) numLabel.textContent = `${val}px`;
      render();
    };

    window.updateSingleLink = function(linkId, key, value) {
      const proj = getCurrentProject();
      if (!proj.linkOverrides) proj.linkOverrides = {};
      if (!proj.linkOverrides[linkId]) proj.linkOverrides[linkId] = {};
      proj.linkOverrides[linkId][key] = value;
      render();
    };

    window.resetSingleLink = function(linkId) {
      const proj = getCurrentProject();
      if (proj.linkOverrides && proj.linkOverrides[linkId]) {
        delete proj.linkOverrides[linkId];
      }
      render();
      openLinkDrawer(linkId);
    };

    // ========================================================
    // 右側抽屜：極簡緊湊收斂表單 (標籤左置、高密度單屏)
    // ========================================================
    function selectNode(id) {
      selectedNodeId = id;
      selectedLinkId = null;
      render();

      const proj = getCurrentProject();
      const node = findNodeById(proj.root, id);
      if (!node) {
        sideDrawer.classList.add('hidden');
        return;
      }

      sideDrawer.classList.remove('hidden');
      const isRoot = node.id === proj.root.id;
      const duties = normalizeDuties(node.responsibilities);
      node.responsibilities = duties;
      const currentColor = node.colorTheme || 'blue';
      const currentIntensity = node.colorIntensity || 'normal';
      const { nodes } = flatten(proj.root);

      const firstLetter = (node.name || '待')[0];
      const parentCandidates = nodes.filter(n => n.id !== node.id && !isDescendant(node, n.id));
      const currentParent = findParentNode(proj.root, node.id);
      const matrixCandidates = nodes.filter(n => n.id !== node.id && !isDescendant(node, n.id));

      drawerHeaderContent.innerHTML = `
        <div class="drawer-header-left">
          <div class="avatar-circle">${firstLetter}</div>
          <div class="drawer-title-group">
            <span class="drawer-title-text">${escapeHtml(node.name || '姓名待填')}</span>
            <span class="drawer-subtitle-text">${escapeHtml(node.title || '職位待定')}</span>
          </div>
        </div>
        <button class="icon-btn" onclick="closeDrawer()" style="width: 20px; height: 20px;">✕</button>
      `;

      drawerFormContent.innerHTML = `
        <!-- 基本資料 (單行雙欄、標籤嚴格左置) -->
        <div class="form-compact-section">
          <div class="field-two-col">
            <div class="field-col">
              <span class="field-col-label">姓名</span>
              <input type="text" class="field-input" id="edit-name" value="${escapeHtml(node.name || '')}" placeholder="成員姓名">
            </div>
            <div class="field-col">
              <span class="field-col-label">職位</span>
              <input type="text" class="field-input" id="edit-title" value="${escapeHtml(node.title || '')}" placeholder="崗位稱謂">
            </div>
          </div>

          <div class="field-row">
            <span class="field-label">部門</span>
            <input type="text" class="field-input" id="edit-dept" value="${escapeHtml(node.department || '')}" placeholder="如：架構組、商業化組">
          </div>

          <!-- 色彩與濃度收攏到一行 -->
          <div class="field-row">
            <span class="field-label">色彩</span>
            <div class="color-swatch-compact-row">
              ${CARD_PALETTES.map(p => `
                <div class="color-swatch-item ${p.id === currentColor ? 'active' : ''}" 
                     style="background-color: ${p.hex};" 
                     title="${p.name}" 
                     onclick="setNodeColor('${p.id}')"></div>
              `).join('')}
              <div class="intensity-capsule">
                <button class="intensity-btn ${currentIntensity === 'light' ? 'active' : ''}" onclick="setNodeIntensity('light')">淡</button>
                <button class="intensity-btn ${currentIntensity === 'normal' ? 'active' : ''}" onclick="setNodeIntensity('normal')">中</button>
                <button class="intensity-btn ${currentIntensity === 'vivid' ? 'active' : ''}" onclick="setNodeIntensity('vivid')">濃</button>
              </div>
            </div>
          </div>

          <!-- 批量套用按鈕緊湊並排 -->
          <div class="field-row" style="margin-top: 1px;">
            <span class="field-label">同步</span>
            <button class="btn-row-action" onclick="applyColorToSubtree('${node.id}')" title="將色彩與濃度同步套用至所有直屬下級">⬇️ 同步下級</button>
            <button class="btn-row-action" onclick="applyColorToSameDepth('${node.id}')" title="將色彩與濃度同步套用至全架構所有同級崗位">↔️ 同步同級</button>
          </div>
        </div>

        <!-- 組織歸屬與編制 (單行左置) -->
        <div class="form-compact-section">
          ${!isRoot ? `
            <div class="field-row">
              <span class="field-label">主管</span>
              <select class="field-select" id="edit-parent">
                ${parentCandidates.map(c => `
                  <option value="${c.id}" ${currentParent && currentParent.id === c.id ? 'selected' : ''}>
                    ${escapeHtml(c.name)} - ${escapeHtml(c.title)}
                  </option>
                `).join('')}
              </select>
            </div>
          ` : ''}

          <div class="field-row">
            <span class="field-label">虛線</span>
            <select class="field-select" id="edit-matrix">
              <option value="">無 (僅直屬實線主管)</option>
              ${matrixCandidates.map(c => `
                <option value="${c.id}" ${node.matrixManagerId === c.id ? 'selected' : ''}>
                  ${escapeHtml(c.name)} - ${escapeHtml(c.title)}
                </option>
              `).join('')}
            </select>
          </div>

          <div class="field-row">
            <span class="field-label">編制</span>
            <select class="field-select" id="edit-status">
              <option value="active" ${(!node.status || node.status === 'active') ? 'selected' : ''}>✅ 正式在職 (Active)</option>
              <option value="hiring" ${node.status === 'hiring' ? 'selected' : ''}>🎯 招募空缺中 (HC Open)</option>
              <option value="contractor" ${node.status === 'contractor' ? 'selected' : ''}>💼 外聘顧問 (Contractor)</option>
            </select>
          </div>
        </div>

        <!-- RACI 職責清單 (高密度緊湊清單) -->
        <div class="form-compact-section">
          <div class="compact-section-header">
            <span>職責清單 (${duties.length})</span>
            <div style="display: flex; gap: 4px;">
              <button class="btn-row-action" style="padding: 1px 6px;" onclick="addDutyItem()">+ 新增</button>
              <button class="btn-row-action" style="padding: 1px 6px;" onclick="openBatchModal()">⚡ 批次</button>
            </div>
          </div>

          <div class="duty-manage-list" id="duty-inputs-container">
            ${duties.map((d, index) => `
              <div class="duty-manage-item">
                <button class="raci-toggle-btn raci-pill raci-${d.raci}" onclick="cycleRaci(${index})" title="點選切換 RACI">${d.raci}</button>
                <input type="text" class="duty-manage-input" data-index="${index}" value="${escapeHtml(d.text)}" placeholder="職責描述事項...">
                <button class="mini-svg-btn danger" onclick="deleteDutyItem(${index})" title="刪除" style="width: 18px; height: 18px; border: none; background: transparent;">✕</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      drawerFooterActions.innerHTML = `
        <button class="footer-act-btn" onclick="addSingleChild('${node.id}')">+ 加下級</button>
        <button class="footer-act-btn highlight" onclick="addHiringChild('${node.id}')">🎯 招募HC</button>
        <button class="footer-act-btn" onclick="addTwoLevels('${node.id}')">+ 加兩層</button>
        ${!isRoot ? `<button class="footer-act-btn danger" onclick="removeNode('${node.id}')">🗑️ 刪除</button>` : ''}
      `;

      // 事件綁定
      document.getElementById('edit-name').addEventListener('input', (e) => {
        node.name = e.target.value;
        render();
      });
      document.getElementById('edit-title').addEventListener('input', (e) => {
        node.title = e.target.value;
        render();
      });
      document.getElementById('edit-dept').addEventListener('input', (e) => {
        node.department = e.target.value;
        render();
      });

      const editParentSelect = document.getElementById('edit-parent');
      if (editParentSelect) {
        editParentSelect.addEventListener('change', (e) => {
          changeNodeParent(node.id, e.target.value);
        });
      }

      document.getElementById('edit-matrix').addEventListener('change', (e) => {
        node.matrixManagerId = e.target.value || null;
        render();
      });

      document.getElementById('edit-status').addEventListener('change', (e) => {
        node.status = e.target.value;
        render();
      });

      document.querySelectorAll('.duty-manage-input').forEach(inp => {
        inp.addEventListener('input', (e) => {
          const idx = parseInt(e.target.getAttribute('data-index'), 10);
          node.responsibilities[idx].text = e.target.value;
          render();
        });
      });
    }

    window.closeDrawer = function() {
      sideDrawer.classList.add('hidden');
      selectedNodeId = null;
      selectedLinkId = null;
      render();
    };

    // 畫布外觀獨立切換 (底色與底紋解耦，即時保存並即時渲染)
    window.setCanvasBg = function(bgKey, label) {
      const proj = getCurrentProject();
      proj.canvasBg = bgKey;
      saveData();
      const lbl = document.getElementById('canvas-bg-label');
      if (lbl) lbl.textContent = label;
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
      render();
      const nameMap = { ivory: '護眼米黃', white: '純淨純白', slate: '現代冷灰', teal: '淡雅青綠', onyx: '深空暗黑' };
      showToast(`畫布底色已即時套用：${nameMap[bgKey] || label || bgKey}`, '🎨');
    };

    window.setCanvasPattern = function(patternKey) {
      const proj = getCurrentProject();
      proj.canvasPattern = patternKey;
      saveData();
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
      render();
      const patMap = { dots: '微點陣', grid: '工程網格', none: '純色無紋' };
      showToast(`畫布底紋已切換：${patMap[patternKey] || patternKey}`, '📐');
    };

    // 全局一鍵套用卡片風格色系 (與畫布底色解耦，即時保存並即時渲染)
    window.setGlobalCardPalette = function(paletteKey) {
      const proj = getCurrentProject();
      const colorMap = {
        'classic': { theme: 'blue', name: '經典商務藍系' },
        'emerald': { theme: 'emerald', name: '翡翠生機綠系' },
        'warm': { theme: 'amber', name: '活力暖陽橙系' },
        'purple': { theme: 'purple', name: '科技深邃紫系' },
        'slate': { theme: 'slate', name: '莫蘭迪典雅灰' }
      };
      const target = colorMap[paletteKey] || colorMap['classic'];
      function applyRec(curr, depth) {
        curr.colorTheme = target.theme;
        curr.colorIntensity = depth === 0 ? 'vivid' : (depth === 1 ? 'normal' : 'light');
        if (curr.children) {
          curr.children.forEach(c => applyRec(c, depth + 1));
        }
      }
      applyRec(proj.root, 0);
      proj.cardPaletteTheme = paletteKey;
      saveData();
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
      render();
      if (selectedNodeId) selectNode(selectedNodeId);
      showToast(`全圖卡片主題已即時套用：${target.name}`, '✨');
    };

    // 自主設定色彩與濃度
    window.setNodeColor = function(colorKey) {
      const proj = getCurrentProject();
      const node = findNodeById(proj.root, selectedNodeId);
      if (!node) return;
      node.colorTheme = colorKey;
      selectNode(selectedNodeId);
    };

    window.setNodeIntensity = function(intensity) {
      const proj = getCurrentProject();
      const node = findNodeById(proj.root, selectedNodeId);
      if (!node) return;
      node.colorIntensity = intensity;
      selectNode(selectedNodeId);
    };

    window.applyColorToSubtree = function(nodeId) {
      const proj = getCurrentProject();
      const node = findNodeById(proj.root, nodeId);
      if (!node) return;
      const targetColor = node.colorTheme || 'blue';
      const targetIntensity = node.colorIntensity || 'normal';

      function applyRec(curr) {
        curr.colorTheme = targetColor;
        curr.colorIntensity = targetIntensity;
        if (curr.children) curr.children.forEach(applyRec);
      }
      applyRec(node);
      selectNode(nodeId);
    };

    window.applyColorToSameDepth = function(nodeId) {
      const proj = getCurrentProject();
      const node = findNodeById(proj.root, nodeId);
      if (!node) return;
      const targetColor = node.colorTheme || 'blue';
      const targetIntensity = node.colorIntensity || 'normal';
      const targetDepth = node.depth;

      const { nodes } = flatten(proj.root);
      nodes.forEach(n => {
        if (n.depth === targetDepth) {
          n.colorTheme = targetColor;
          n.colorIntensity = targetIntensity;
        }
      });
      selectNode(nodeId);
    };

    window.cycleRaci = function(idx) {
      const proj = getCurrentProject();
      const node = findNodeById(proj.root, selectedNodeId);
      if (!node || !node.responsibilities || !node.responsibilities[idx]) return;

      const order = ['A', 'R', 'C', 'I'];
      const cur = node.responsibilities[idx].raci || 'R';
      const nextIndex = (order.indexOf(cur) + 1) % order.length;
      node.responsibilities[idx].raci = order[nextIndex];

      selectNode(selectedNodeId);
    };

    function changeNodeParent(nodeId, newParentId) {
      const proj = getCurrentProject();
      const oldParent = findParentNode(proj.root, nodeId);
      const newParent = findNodeById(proj.root, newParentId);
      const self = findNodeById(proj.root, nodeId);

      if (!oldParent || !newParent || !self) return;

      oldParent.children = oldParent.children.filter(c => c.id !== nodeId);
      if (!newParent.children) newParent.children = [];
      newParent.children.push(self);

      render();
    }

    window.openBatchModal = function() {
      const proj = getCurrentProject();
      const node = findNodeById(proj.root, selectedNodeId);
      if (!node) return;
      const duties = normalizeDuties(node.responsibilities);
      document.getElementById('batch-textarea').value = duties.map(d => d.text).join('\n');
      document.getElementById('batch-duty-modal').style.display = 'flex';
    };

    window.closeBatchModal = function() {
      document.getElementById('batch-duty-modal').style.display = 'none';
    };

    window.confirmBatchDuties = function() {
      const text = document.getElementById('batch-textarea').value;
      const proj = getCurrentProject();
      const node = findNodeById(proj.root, selectedNodeId);
      if (node) {
        node.responsibilities = text.split('\n')
          .map(l => l.trim())
          .filter(l => l.length > 0)
          .map((t, i) => ({ text: t, raci: i === 0 ? 'A' : 'R' }));
        selectNode(selectedNodeId);
      }
      closeBatchModal();
    };

    window.addDutyItem = function() {
      const proj = getCurrentProject();
      const node = findNodeById(proj.root, selectedNodeId);
      if (!node) return;
      if (!node.responsibilities) node.responsibilities = [];
      node.responsibilities.push({ text: '新工作職責事項', raci: 'R' });
      selectNode(selectedNodeId);
    };

    window.deleteDutyItem = function(idx) {
      const proj = getCurrentProject();
      const node = findNodeById(proj.root, selectedNodeId);
      if (!node || !node.responsibilities) return;
      node.responsibilities.splice(idx, 1);
      selectNode(selectedNodeId);
    };

    function createEmptyNode(title = "新崗位", name = "待定", dept = "", status = "active") {
      return {
        id: "node-" + Date.now() + "-" + Math.floor(Math.random() * 1000),
        name: name,
        title: title,
        department: dept,
        status: status,
        colorTheme: "blue",
        colorIntensity: "normal",
        matrixManagerId: null,
        responsibilities: [
          { text: "落實關鍵業務產出與職能交付", raci: "A" },
          { text: "團隊內部日常工程協同", raci: "R" }
        ],
        children: []
      };
    }

    window.addHiringChild = function(parentId) {
      const proj = getCurrentProject();
      const parent = findNodeById(proj.root, parentId);
      if (!parent) return;
      if (!parent.children) parent.children = [];
      const newNode = createEmptyNode("待招崗位 (HC)", "待招聘", parent.department || "", "hiring");
      newNode.colorTheme = "amber";
      newNode.colorIntensity = "light";
      parent.children.push(newNode);
      selectNode(newNode.id);
    };

    window.addSingleChild = function(parentId) {
      const proj = getCurrentProject();
      const parent = findNodeById(proj.root, parentId);
      if (!parent) return;
      if (!parent.children) parent.children = [];
      const newNode = createEmptyNode("新職位", "新員工", parent.department || "");
      newNode.colorTheme = parent.colorTheme || "blue";
      newNode.colorIntensity = parent.colorIntensity || "normal";
      parent.children.push(newNode);
      selectNode(newNode.id);
    };

    window.addTwoLevels = function(parentId) {
      const proj = getCurrentProject();
      const parent = findNodeById(proj.root, parentId);
      if (!parent) return;
      if (!parent.children) parent.children = [];

      const level1 = createEmptyNode("組長", "組長待定", parent.department || "");
      const level2 = createEmptyNode("專員", "組員待定", parent.department || "");
      level1.colorTheme = parent.colorTheme || "blue";
      level2.colorTheme = parent.colorTheme || "blue";
      level1.children.push(level2);

      parent.children.push(level1);
      selectNode(level1.id);
    };

    window.addSibling = function(nodeId) {
      const proj = getCurrentProject();
      if (nodeId === proj.root.id) return;
      const parent = findParentNode(proj.root, nodeId);
      if (!parent) return;
      const self = findNodeById(proj.root, nodeId);
      const newNode = createEmptyNode("同級職位", "新同事", self.department || "");
      newNode.colorTheme = self.colorTheme || "blue";
      newNode.colorIntensity = self.colorIntensity || "normal";
      parent.children.push(newNode);
      selectNode(newNode.id);
    };

    window.removeNode = function(nodeId) {
      const proj = getCurrentProject();
      if (nodeId === proj.root.id) {
        alert("無法刪除根節點負責人！");
        return;
      }
      const parent = findParentNode(proj.root, nodeId);
      if (!parent) return;

      const node = findNodeById(proj.root, nodeId);
      const hasChildren = node.children && node.children.length > 0;

      let confirmMsg = `確認要刪除「${node.name || '此成員'}」嗎？`;
      if (hasChildren) {
        confirmMsg += `\n（提示：該成員下方的 ${node.children.length} 位下屬將會一併移除）`;
      }

      if (!confirm(confirmMsg)) return;

      parent.children = parent.children.filter(c => c.id !== nodeId);

      if (selectedNodeId === nodeId) {
        selectedNodeId = null;
        sideDrawer.classList.add('hidden');
      }
      render();
    };

    // 自由便簽管理
    window.addNewNote = function() {
      const proj = getCurrentProject();
      if (!proj.notes) proj.notes = [];

      const centerOffsetX = -panX + (canvasContainer.clientWidth / 2 - 110) / zoom;
      const centerOffsetY = -panY + 80 / zoom;

      const newNote = {
        id: "note-" + Date.now(),
        text: "在此輸入文字備註說明...",
        x: Math.round(centerOffsetX),
        y: Math.round(centerOffsetY)
      };

      proj.notes.push(newNote);
      render();
    };

    window.updateNoteText = function(noteId, text) {
      const proj = getCurrentProject();
      const note = (proj.notes || []).find(n => n.id === noteId);
      if (note) {
        note.text = text;
        saveData();
      }
    };

    window.deleteNote = function(noteId) {
      const proj = getCurrentProject();
      if (!proj.notes) return;
      proj.notes = proj.notes.filter(n => n.id !== noteId);
      render();
    };

    // 連線樣式自選 (即時保存與反饋)
    window.setLinkStyle = function(style, label) {
      const proj = getCurrentProject();
      proj.linkStyle = style;
      saveData();
      const lbl = document.getElementById('link-style-label');
      if (lbl) lbl.textContent = label;
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
      render();
      showToast(`全域連線線型已套用：${label || style}`, '📐');
    };

    window.setLineWidth = function(width) {
      const proj = getCurrentProject();
      proj.lineWidth = width;
      saveData();
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
      render();
      showToast(`全域連線粗細已套用：${width}px`, '📏');
    };

    // 實體 Tab 導航
    function renderProjectTabs() {
      let tabsHtml = '';
      appProjects.forEach(p => {
        const isActive = p.id === activeProjectId;
        const dotColor = isActive ? '#93c5fd' : '#3b82f6';
        tabsHtml += `
          <div class="nav-tab-item ${isActive ? 'active' : ''}" onclick="switchProject('${p.id}')">
            <span class="nav-tab-dot" style="background-color: ${dotColor};"></span>
            <span>${escapeHtml(p.name)}</span>
            ${appProjects.length > 1 ? `<span class="nav-tab-close" onclick="event.stopPropagation(); closeProject('${p.id}')" title="刪除架構">✕</span>` : ''}
          </div>
        `;
      });
      tabsHtml += `<button class="btn-create-tab" id="btn-add-project" onclick="addNewProject()" title="新增中心或部門架構">＋ 新增架構</button>`;
      projectTabsNav.innerHTML = tabsHtml;
    }

    window.switchProject = function(pId) {
      activeProjectId = pId;
      selectedNodeId = null;
      selectedLinkId = null;
      sideDrawer.classList.add('hidden');
      render();
    };

    window.addNewProject = function() {
      const name = prompt("請輸入新公司或新部門的名稱：", "新業務部門");
      if (!name || !name.trim()) return;

      const newId = "proj-" + Date.now();
      const newProj = {
        id: newId,
        name: name.trim(),
        canvasBg: "slate",
        canvasPattern: "dots",
        orientation: "vertical",
        linkStyle: "orthogonal",
        lineWidth: 1.5,
        linkOverrides: {},
        splitOffsets: {},
        notes: [],
        root: {
          id: "node-" + Date.now(),
          name: "負責人待定",
          title: "部門主管",
          department: name.trim(),
          status: "active",
          colorTheme: "blue",
          colorIntensity: "normal",
          matrixManagerId: null,
          responsibilities: [{ text: "負責新架構戰略推進與團隊搭建", raci: "A" }],
          children: []
        }
      };
      appProjects.push(newProj);
      activeProjectId = newId;
      render();
    };

    window.closeProject = function(pId) {
      if (appProjects.length <= 1) return;
      const proj = appProjects.find(p => p.id === pId);
      if (!confirm(`確認要刪除「${proj?.name}」整套架構嗎？此操作不可逆。`)) return;

      appProjects = appProjects.filter(p => p.id !== pId);
      if (activeProjectId === pId) {
        activeProjectId = appProjects[0].id;
      }
      render();
    };

    window.setOrientation = function(orient) {
      const proj = getCurrentProject();
      proj.orientation = orient;
      render();
    };

    window.setDutyView = function(show) {
      showResponsibilities = show;
      render();
    };

    window.toggleDropdown = function(id) {
      const menu = document.getElementById(id);
      const isShow = menu.classList.contains('show');
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
      if (!isShow) menu.classList.add('show');
    };

    window.addEventListener('click', (e) => {
      if (!e.target.closest('.dropdown-menu') && !e.target.closest('.tool-btn')) {
        document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
      }
    });

    function findNodeById(root, id) {
      if (root.id === id) return root;
      if (root.children) {
        for (let child of root.children) {
          const res = findNodeById(child, id);
          if (res) return res;
        }
      }
      return null;
    }

    function findParentNode(root, childId) {
      if (root.children) {
        for (let child of root.children) {
          if (child.id === childId) return root;
          const res = findParentNode(child, childId);
          if (res) return res;
        }
      }
      return null;
    }

    function isDescendant(parent, targetId) {
      if (!parent || !parent.children) return false;
      for (let child of parent.children) {
        if (child.id === targetId) return true;
        if (isDescendant(child, targetId)) return true;
      }
      return false;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function updateTransform() {
      viewportGroup.setAttribute('transform', `translate(${panX}, ${panY}) scale(${zoom})`);
    }

    canvasContainer.addEventListener('mousedown', (e) => {
      if (e.target.closest('.node-card') || 
          e.target.closest('.free-note-box') || 
          e.target.closest('.link-group') || 
          e.target.closest('.link-split-handle') || 
          e.target.closest('.link-matrix-handle') || 
          e.target.closest('.viewport-controls') || 
          e.target.closest('.floating-toolbar') || 
          e.target.closest('#side-drawer') ||
          e.target.closest('.dropdown-menu')) return;
      isPanning = true;
      canvasContainer.classList.add('panning');
      startX = e.clientX - panX;
      startY = e.clientY - panY;

      // 點空白處關閉下拉選單與取消選中
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
      if (selectedLinkId || selectedNodeId) {
        selectedLinkId = null;
        selectedNodeId = null;
        sideDrawer.classList.add('hidden');
        render();
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      if (isPanning) {
        isPanning = false;
        canvasContainer.classList.remove('panning');
      }
    });

    canvasContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = 1.08;
      if (e.deltaY < 0) {
        zoom = Math.min(2.5, zoom * factor);
      } else {
        zoom = Math.max(0.3, zoom / factor);
      }
      updateTransform();
    }, { passive: false });

    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      zoom = Math.min(2.5, zoom * 1.2);
      updateTransform();
    });

    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      zoom = Math.max(0.3, zoom / 1.2);
      updateTransform();
    });

    document.getElementById('btn-zoom-reset').addEventListener('click', () => {
      zoom = 1;
      panX = 60;
      panY = 70;
      updateTransform();
    });

    function saveData() {
      try {
        localStorage.setItem('org_chart_projects', JSON.stringify(appProjects));
      } catch (err) {
        console.error('儲存失敗:', err);
      }
    }
    window.saveData = saveData;
    window.saveProjects = saveData;

    function showToast(msg, icon = '✓') {
      const toast = document.getElementById('system-toast');
      if (!toast) return;
      toast.innerHTML = `<span style="color: #60a5fa; font-weight: 800;">${icon}</span> <span>${msg}</span>`;
      toast.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1800);
    }
    window.showToast = showToast;

    window.exportJson = function() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appProjects, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `組織架構全量備份_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    };

    document.getElementById('file-import').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].root) {
            appProjects = parsed;
            activeProjectId = appProjects[0].id;
            selectedNodeId = null;
            selectedLinkId = null;
            sideDrawer.classList.add('hidden');
            render();
            alert("組織架構資料還原成功！");
          } else {
            alert("檔案格式不正確，需包含有效的組織架構樹。");
          }
        } catch (err) {
          alert("讀取檔案失敗，請確保為合法 JSON 格式。");
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    window.resetDemo = function() {
      if (confirm("確認重置回預設示範架構嗎？目前的修改將被覆蓋。")) {
        appProjects = JSON.parse(JSON.stringify(initialProjects));
        activeProjectId = appProjects[0].id;
        selectedNodeId = null;
        selectedLinkId = null;
        sideDrawer.classList.add('hidden');
        render();
      }
    };

    window.exportSvgFile = function() {
      const proj = getCurrentProject();
      const { nodes } = flatten(proj.root);
      if (nodes.length === 0) return;

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      const cardH = getCardH();

      nodes.forEach(n => {
        if (n.x < minX) minX = n.x;
        if (n.x + CARD_W > maxX) maxX = n.x + CARD_W;
        if (n.y < minY) minY = n.y;
        if (n.y + cardH > maxY) maxY = n.y + cardH;
      });

      (proj.notes || []).forEach(note => {
        if (note.x < minX) minX = note.x;
        if (note.x + 220 > maxX) maxX = note.x + 220;
        if (note.y < minY) minY = note.y;
        if (note.y + 80 > maxY) maxY = note.y + 80;
      });

      const padding = 50;
      const exportW = (maxX - minX) + padding * 2;
      const exportH = (maxY - minY) + padding * 2;

      const svgClone = svg.cloneNode(true);
      const cloneViewport = svgClone.querySelector('#viewport-group');
      cloneViewport.setAttribute('transform', `translate(${-minX + padding}, ${-minY + padding}) scale(1)`);
      svgClone.setAttribute('width', exportW);
      svgClone.setAttribute('height', exportH);
      svgClone.setAttribute('viewBox', `0 0 ${exportW} ${exportH}`);
      svgClone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

      const styleElement = document.createElement('style');
      styleElement.textContent = document.querySelector('style').textContent;
      svgClone.prepend(styleElement);

      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svgClone);

      const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const a = document.createElement('a');
      a.download = `${proj.name}_組織架構圖_${new Date().toISOString().slice(0, 10)}.svg`;
      a.href = URL.createObjectURL(blob);
      document.body.appendChild(a);
      a.click();
      a.remove();
    };

    window.exportImage = function() {
      const proj = getCurrentProject();
      const { nodes } = flatten(proj.root);
      if (nodes.length === 0) return;

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      const cardH = getCardH();

      nodes.forEach(n => {
        if (n.x < minX) minX = n.x;
        if (n.x + CARD_W > maxX) maxX = n.x + CARD_W;
        if (n.y < minY) minY = n.y;
        if (n.y + cardH > maxY) maxY = n.y + cardH;
      });

      (proj.notes || []).forEach(note => {
        if (note.x < minX) minX = note.x;
        if (note.x + 220 > maxX) maxX = note.x + 220;
        if (note.y < minY) minY = note.y;
        if (note.y + 80 > maxY) maxY = note.y + 80;
      });

      const padding = 50;
      const exportW = (maxX - minX) + padding * 2;
      const exportH = (maxY - minY) + padding * 2;

      const svgClone = svg.cloneNode(true);
      const cloneViewport = svgClone.querySelector('#viewport-group');
      cloneViewport.setAttribute('transform', `translate(${-minX + padding}, ${-minY + padding}) scale(1)`);
      svgClone.setAttribute('width', exportW);
      svgClone.setAttribute('height', exportH);

      const styleElement = document.createElement('style');
      styleElement.textContent = document.querySelector('style').textContent;
      svgClone.prepend(styleElement);

      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svgClone);

      const canvas = document.createElement('canvas');
      const dpr = 2;
      canvas.width = exportW * dpr;
      canvas.height = exportH * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      // 對應底色
      const bgMap = {
        'ivory': '#faf6ee',
        'white': '#ffffff',
        'slate': '#f1f5f9',
        'teal': '#f0fdf4',
        'onyx': '#0b1120'
      };
      ctx.fillStyle = bgMap[proj.canvasBg] || '#f1f5f9';
      ctx.fillRect(0, 0, exportW, exportH);

      const img = new Image();
      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const URL = window.URL || window.webkitURL || window;
      const blobURL = URL.createObjectURL(svgBlob);

      img.onload = () => {
        try {
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(blobURL);

          const a = document.createElement('a');
          a.download = `${proj.name}_組織架構圖_${new Date().toISOString().slice(0, 10)}.png`;
          a.href = canvas.toDataURL('image/png');
          document.body.appendChild(a);
          a.click();
          a.remove();
        } catch (e) {
          exportSvgFile();
        }
      };
      img.onerror = () => {
        exportSvgFile();
      };
      img.src = blobURL;
    };

    render();
  </script>
<div id="system-toast" class="system-toast"></div>
</body>
</html>
